name: Deploy k3s

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Apply observability to k3s
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup kubectl
        uses: azure/setup-kubectl@911ae5630d033486b4382f7ce3a3375d2b2f7383 # v4
        with:
          version: "v1.31.4"

      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBECONFIG_B64" | head -c 20 | grep -q 'apiVersion'; then
            printf '%s\n' "$KUBECONFIG_B64" > "$HOME/.kube/config"
          else
            printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          unset KUBECONFIG_B64

      - name: Ensure namespace + grafana secret
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl get ns observability >/dev/null 2>&1 || kubectl create namespace observability
          kubectl -n observability create secret generic grafana-admin \
            --from-literal=admin-user=admin \
            --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Secret keys present:"
          kubectl -n observability get secret grafana-admin -o jsonpath='{.data}' \
            | python3 -c "import sys,json; print(' '.join(json.load(sys.stdin).keys()))"

      - name: Apply + rollout
        run: |
          chmod +x deploy/k3s/deploy.sh
          ./deploy/k3s/deploy.sh
