name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - mqtt-interceptor
          - mosquitto-exporter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run ruff (lint)
        working-directory: ${{ matrix.component }}
        run: |
          uv run ruff check src/

      - name: Run ruff (format)
        working-directory: ${{ matrix.component }}
        run: |
          uv run ruff format --check src/

      - name: Run mypy
        working-directory: ${{ matrix.component }}
        run: |
          uv run mypy src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - mqtt-interceptor
          - mosquitto-exporter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run pytest
        working-directory: ${{ matrix.component }}
        run: |
          set +e
          uv run pytest tests/ -v --tb=short
          status=$?
          set -e
          # 5 = no tests collected (tolerate); anything else must fail
          if [ $status -eq 0 ] || [ $status -eq 5 ]; then
            exit 0
          fi
          exit $status

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ${{ matrix.component }}/coverage.xml
          flags: ${{ matrix.component }}

  docker:
    name: Build & Push Docker Images
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        component:
          - name: mqtt-interceptor
            context: mqtt-interceptor
            dockerfile: docker/mqtt-interceptor/Dockerfile
          - name: mosquitto-exporter
            context: mosquitto-exporter
            dockerfile: docker/mosquitto-exporter/Dockerfile
          - name: test-publisher
            context: docker/test-publisher
            dockerfile: docker/test-publisher/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  docker-compose-test:
    name: Docker Compose Integration Test
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build images
        working-directory: docker
        run: |
          docker compose build --parallel

      - name: Start services
        working-directory: docker
        run: |
          docker compose up -d mosquitto mqtt-interceptor mosquitto-exporter otelcol prometheus jaeger
          sleep 30

      - name: Health checks
        working-directory: docker
        run: |
          docker compose ps
          curl -f http://localhost:9494/metrics
          curl -f http://localhost:9464/metrics
          curl -f http://localhost:16686/
          curl -f http://localhost:9090/-/healthy

      - name: Test message flow
        working-directory: docker
        run: |
          docker compose up -d mqtt-test-publisher
          sleep 15
          # Check traces appear in Jaeger
          curl -s "http://localhost:16686/api/traces?service=mqtt-interceptor&lookback=1h" | jq '.data | length'

      - name: Teardown
        if: always()
        working-directory: docker
        run: |
          docker compose down -v

  release:
    name: Create Release
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          git log $(git describe --tags --abbrev=0)..HEAD --pretty=format:"- %s (%an)" > CHANGELOG.md
          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}