name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - mqtt-interceptor
          - mosquitto-exporter
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run ruff (lint)
        working-directory: ${{ matrix.component }}
        run: |
          uv run ruff check src/

      - name: Run ruff (format)
        working-directory: ${{ matrix.component }}
        run: |
          uv run ruff format --check src/

      - name: Run mypy
        working-directory: ${{ matrix.component }}
        run: |
          uv run mypy src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - mqtt-interceptor
          - mosquitto-exporter
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run pytest
        working-directory: ${{ matrix.component }}
        run: |
          set +e
          uv run pytest tests/ -v --tb=short
          status=$?
          set -e
          # 5 = no tests collected (tolerate); anything else must fail
          if [ $status -eq 0 ] || [ $status -eq 5 ]; then
            exit 0
          fi
          exit $status

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ matrix.component }}/coverage.xml
          flags: ${{ matrix.component }}

  docker:
    name: Build & Push Docker Images
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        component:
          - name: mqtt-interceptor
            context: mqtt-interceptor
            dockerfile: docker/mqtt-interceptor/Dockerfile
          - name: mosquitto-exporter
            context: mosquitto-exporter
            dockerfile: docker/mosquitto-exporter/Dockerfile
          - name: test-publisher
            context: docker/test-publisher
            dockerfile: docker/test-publisher/Dockerfile
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  docker-compose-test:
    name: Docker Compose Integration Test
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images
        working-directory: docker
        run: |
          docker compose build --parallel

      - name: Start services
        working-directory: docker
        run: |
          docker compose up -d mosquitto mqtt-interceptor mosquitto-exporter otelcol prometheus jaeger
          sleep 30

      - name: Health checks
        working-directory: docker
        run: |
          docker compose ps
          curl -f http://localhost:9494/metrics
          curl -f http://localhost:9464/metrics
          curl -f http://localhost:16686/
          curl -f http://localhost:9090/-/healthy

      - name: Test message flow
        working-directory: docker
        run: |
          docker compose up -d mqtt-test-publisher
          sleep 15
          # Check traces appear in Jaeger
          curl -s "http://localhost:16686/api/traces?service=mqtt-interceptor&lookback=1h" | jq '.data | length'

      - name: Teardown
        if: always()
        working-directory: docker
        run: |
          docker compose down -v

  release:
    name: Create Release
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          git log $(git describe --tags --abbrev=0)..HEAD --pretty=format:"- %s (%an)" > CHANGELOG.md
          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}