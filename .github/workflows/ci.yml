name: CI/CD
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  lint:
    name: Lint and type checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
        - mqtt-interceptor
        - mosquitto-exporter
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        enable-cache: true
        version: 0.12.7
    - name: Run the local component contract
      env:
        COMPONENT: ${{ matrix.component }}
      run: bash scripts/ci.sh lint "$COMPONENT"
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
        - mqtt-interceptor
        - mosquitto-exporter
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        enable-cache: true
        version: 0.12.7
    - name: Run the local component contract
      env:
        COMPONENT: ${{ matrix.component }}
      run: bash scripts/ci.sh test "$COMPONENT"
  docker-compose-test:
    name: Docker Compose Integration Test
    needs:
    - lint
    - test
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.7
    - name: Run isolated Compose smoke with readiness and trace assertions
      run: bash scripts/ci.sh integration
    timeout-minutes: 20
  kubernetes-runtime:
    name: Hardened monitoring image startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.7
    - name: Check rendered Kubernetes configuration
      run: kubectl kustomize deploy/k3s > "$RUNNER_TEMP/monitoring.yaml"
    - name: Check non-root startup, writable data volumes and dashboard provisioning
      run: uv run --project mqtt-interceptor --locked python scripts/kubernetes_smoke.py
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  workflow_call: {}
