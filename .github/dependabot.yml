version: 2
updates:
  - package-ecosystem: docker
    directory: /docker/test-publisher
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /mosquitto-exporter
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /mqtt-interceptor
    schedule:
      interval: daily
  # Renovate owns CI updates. The ignore rule also prevents separate
  # Dependabot security-update PRs; vulnerability alerts remain enabled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
