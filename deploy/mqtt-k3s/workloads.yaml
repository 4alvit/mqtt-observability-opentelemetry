              assert value >= 0, "Invalid connected-client count"
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9494
          periodSeconds: 30
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /metrics
