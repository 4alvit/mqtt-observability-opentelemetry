apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-otel-collector
  namespace: observability
  labels: &id001
    app: mqtt-otel-collector
    app.kubernetes.io/part-of: mqtt-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mqtt-otel-collector
  template:
    metadata:
      labels: *id001
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8889'
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: mp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mqtt-otel-collector
        image: 192.168.167.25:5050/mqtt-otel-collector@sha256:b5cf983651c32c3ca13f936deb51742015a54d121f388cac248923ddeb8cc9fc
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - name: metrics
          containerPort: 8889
        - name: otlp
          containerPort: 4317
        - name: health
          containerPort: 13133
        env: []
        args:
        - --config=/etc/otelcol/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 30
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 5
          failureThreshold: 24
          timeoutSeconds: 5
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        configMap:
          name: mqtt-otel-config
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-otel-collector
  namespace: observability
  labels:
    app: mqtt-otel-collector
    app.kubernetes.io/part-of: mqtt-observability
spec:
  selector:
    app: mqtt-otel-collector
  ports:
  - name: otlp
    port: 4317
    targetPort: otlp
  - name: metrics
    port: 8889
    targetPort: metrics
