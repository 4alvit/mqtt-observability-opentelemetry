apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-interceptor
  namespace: observability
  labels: &id001
    app: mqtt-interceptor
    app.kubernetes.io/part-of: mqtt-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mqtt-interceptor
  template:
    metadata:
      labels: *id001
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9464'
        prometheus.io/path: /metrics
        victron.2560801.xyz/source-commit: 924197b2bfadd18d1cfe2d7d760ab4ad2e097f3d
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: mp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mqtt-interceptor
        image: 192.168.167.25:5050/mqtt-interceptor@sha256:591f237c711f1673f66f4cbe7fcd2a78e8e96b80ec8a163927b8304e77ef4b58
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - name: metrics
          containerPort: 9464
        env:
        - name: MQTT_UPSTREAM_HOST
          value: 192.168.160.150
        - name: MQTT_UPSTREAM_PORT
          value: '1883'
        - name: MQTT_VERSION
          value: '3'
        - name: OTEL_ENDPOINT
          value: http://mqtt-otel-collector.observability.svc.cluster.local:4317
        - name: TRACE_TOPIC_PATTERNS
          value: $SYS/broker/load/messages/received/total
        - name: TRACE_SAMPLE_RATE
          value: '1'
        - name: MQTT_CLIENT_ID
          value: observability-cerbo-heartbeat
        - name: OTEL_SERVICE_NAME
          value: cerbo-mqtt-observer
        readinessProbe:
          httpGet:
            path: /ready
            port: 9464
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9464
          periodSeconds: 30
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /metrics
            port: 9464
          periodSeconds: 5
          failureThreshold: 36
          timeoutSeconds: 5
      terminationGracePeriodSeconds: 30
---
