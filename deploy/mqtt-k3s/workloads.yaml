          value: '{"deployment.environment":"home","service.namespace":"mqtt-observability","broker.kind":"flashmq","broker.site":"cerbo"}'
        - name: METRICS_BROKER_TYPE
          value: flashmq
        - name: METRICS_FLASHMQ_THREADS
          value: '1'
        - name: METRICS_STALE_THRESHOLD
          value: '45'
        - name: MQTT_CLIENT_ID
          value: observability-cerbo-sys
        - name: OTEL_SERVICE_NAME
          value: cerbo-broker-exporter
        - name: PROMETHEUS_ENABLED
