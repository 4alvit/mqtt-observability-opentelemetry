apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - priority-class.yaml
  - prometheus-config.yaml
  - tempo-config.yaml
  - grafana-datasources.yaml
  - grafana-dashboards-provider.yaml
  - prometheus-pvc.yaml
  - tempo-pvc.yaml
  - grafana-pvc.yaml
  - mp-storage.yaml
  - local-store-pdbs.yaml
  - prometheus.yaml
  - tempo.yaml
  - grafana.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - ingress.yaml
configMapGenerator:
  - name: grafana-host-dashboards
    files:
      - dashboards/node-exporter-full.json
      - dashboards/k8s-views-pods.json
      - dashboards/k8s-cluster-prometheus.json
      - dashboards/k8s-cluster.json
generatorOptions:
  disableNameSuffixHash: true
