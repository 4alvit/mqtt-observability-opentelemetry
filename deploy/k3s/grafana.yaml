apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      priorityClassName: observability-critical
      initContainers:
        - name: fetch-dashboards
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -eu
              apk add --no-cache curl jq >/dev/null
              DEST=/dashboards
              fetch() {
                id="$1"; out="$2"
                echo "fetching grafana.com dashboard $id -> $out"
                curl -fsSL "https://grafana.com/api/dashboards/${id}/revisions/latest/download" -o /tmp/raw.json
                # Bare dashboard JSON or {dashboard: {...}}
                if jq -e '.dashboard' /tmp/raw.json >/dev/null 2>&1; then
                  jq '.dashboard | .id=null' /tmp/raw.json > "$DEST/$out"
                else
                  jq '.id=null' /tmp/raw.json > "$DEST/$out"
                fi
                # Point datasource refs at provisioned Prometheus uid
                sed -i                   -e 's/"uid":"${DS_PROMETHEUS}"/"uid":"Prometheus"/g'                   -e 's/"uid": "${DS_PROMETHEUS}"/"uid":"Prometheus"/g'                   -e 's/"datasource": "Prometheus"/"datasource": {"type":"prometheus","uid":"Prometheus"}/g'                   "$DEST/$out" || true
              }
              fetch 1860 node-exporter-full.json
              fetch 15760 k8s-views-pods.json
              fetch 6417 k8s-cluster-prometheus.json
              fetch 7249 k8s-cluster.json
              ls -la "$DEST"
          volumeMounts:
            - name: dashboards
              mountPath: /dashboards
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.k3s.2560801.xyz/"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      name: http
