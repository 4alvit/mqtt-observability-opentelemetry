apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - deploy/pvc.yaml
  - deploy/rbac.yaml
  - deploy/cronjob.yaml
configMapGenerator:
  - name: observability-recovery-code
    files: [archive.py, restore.py, prepare.py, backup.py, __init__.py, PROVENANCE.json]
generatorOptions:
  disableNameSuffixHash: true
