apiVersion: batch/v1
kind: CronJob
metadata:
  name: observability-backup
  namespace: observability
spec:
  # Constant 72-hour interval, including month/year boundaries.
  schedule: "@every 72h"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  # Do not set startingDeadlineSeconds: a sliding deadline resets @every's anchor.
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Three 20-minute component budgets plus namespace export and verification.
      activeDeadlineSeconds: 4800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: observability-backup
        spec:
          serviceAccountName: observability-backup
          nodeSelector:
            kubernetes.io/hostname: mp
          restartPolicy: Never
          securityContext:
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: backup
              # Pinned recovery runtime includes the verified Kubernetes TLS dependencies.
              image: ghcr.io/4alvit/mqtt-observability-opentelemetry/recovery-runtime@sha256:278fe9cf32be53f1b1503d9ea2b9c0c59c07804af94ee1164ae5feb4cfac5aac
              command: [python, -B, -m, recovery.backup]
              workingDir: /code
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                  add: [DAC_READ_SEARCH]
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 2Gi}
              volumeMounts:
                - {name: grafana, mountPath: /sources/grafana, readOnly: true}
                - {name: prometheus, mountPath: /sources/prometheus, readOnly: true}
                - {name: tempo, mountPath: /sources/tempo, readOnly: true}
                - {name: backups, mountPath: /backup}
                - {name: code, mountPath: /code/recovery, readOnly: true}
                - {name: identity, mountPath: /identity, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: grafana, persistentVolumeClaim: {claimName: grafana-data-mp, readOnly: true}}
            - {name: prometheus, persistentVolumeClaim: {claimName: prometheus-data-mp, readOnly: true}}
            - {name: tempo, persistentVolumeClaim: {claimName: tempo-data-mp, readOnly: true}}
            - {name: backups, persistentVolumeClaim: {claimName: observability-backups-nfs-v1}}
            - {name: code, configMap: {name: observability-recovery-code, defaultMode: 0444}}
            - {name: identity, configMap: {name: observability-backup-identity, defaultMode: 0444}}
            - {name: tmp, emptyDir: {sizeLimit: 2Gi}}
