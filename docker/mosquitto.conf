# Mosquitto Configuration for MQTT Observability Demo
#
# Enables $SYS topics for monitoring
# Supports MQTT v5 for user properties (trace context propagation)

# Listeners
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket listener for web clients
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# $SYS topics - enable for monitoring ($SYS topics are published by default;
# sys_interval controls how often, in seconds, they are updated)
sys_interval 10

# Message limits
max_packet_size 1048576
max_inflight_messages 100
max_queued_messages 1000

# Client limits
max_connections -1

# QoS and Retained messages
max_qos 2
retain_available true

# Security (adjust for production)
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl