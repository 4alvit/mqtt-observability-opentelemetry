# OpenTelemetry Collector Configuration
# Receives traces and metrics from MQTT components
# Exports to Jaeger (traces) and Prometheus (metrics)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otelcol'
          static_configs:
            - targets: ['localhost:8888']
        - job_name: 'mqtt-interceptor'
          static_configs:
            - targets: ['mqtt-interceptor:9464']
        - job_name: 'mosquitto-exporter'
          static_configs:
            - targets: ['mosquitto-exporter:9494']

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resource:
    attributes:
      - key: deployment.environment
        value: "demo"
        action: upsert
      - key: service.namespace
        value: "mqtt-observability"
        action: upsert

exporters:
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: mqtt
    const_labels:
      cluster: demo
  logging:
    loglevel: debug
    sampling_initial: 5
    sampling_thereafter: 200

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [jaeger, logging]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, logging]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: 0.0.0.0:8888