global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'mqtt-demo'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mosquitto-exporter'
    static_configs:
      - targets: ['mosquitto-exporter:9494']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'mqtt-interceptor'
    static_configs:
      - targets: ['mqtt-interceptor:9464']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'otelcol'
    static_configs:
      - targets: ['otelcol:8888']
    scrape_interval: 10s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 10s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s