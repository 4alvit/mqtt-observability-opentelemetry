version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$SYS/broker/uptime", "-C", "1", "-i", "healthcheck", "-W", "5"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mqtt-observability
    restart: unless-stopped

  mqtt-interceptor:
    build:
      context: ../mqtt-interceptor
      dockerfile: Dockerfile
    container_name: mqtt-interceptor
    ports:
      - "1884:1884"
      - "9464:9464"
    environment:
      - MQTT_LISTEN_HOST=0.0.0.0
      - MQTT_LISTEN_PORT=1884
      - MQTT_UPSTREAM_HOST=mosquitto
      - MQTT_UPSTREAM_PORT=1883
      - MQTT_VERSION=5
      - TRACE_PROPAGATOR=w3c
      - TRACE_TOPIC_PATTERNS=devices/+/telemetry,devices/+/commands,vehicles/+/telemetry
      - TRACE_SAMPLE_RATE=0.1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4317
      - OTEL_SERVICE_NAME=mqtt-interceptor
      - METRICS_ENABLED=true
      - METRICS_PORT=9464
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      mosquitto:
        condition: service_healthy
      otelcol:
        condition: service_started
    networks:
      - mqtt-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9464/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  mosquitto-exporter:
    build:
      context: ../mosquitto-exporter
      dockerfile: Dockerfile
    container_name: mosquitto-exporter
    ports:
      - "9494:9494"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_CLIENT_ID=mosquitto-exporter
      - MQTT_VERSION=5
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4317
      - OTEL_SERVICE_NAME=mosquitto-exporter
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PORT=9494
      - METRICS_EXPORT_INTERVAL=30
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      mosquitto:
        condition: service_healthy
      otelcol:
        condition: service_started
    networks:
      - mqtt-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9494/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.106
    container_name: otel-collector
    command: ["--config=/etc/otelcol-config.yaml"]
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8888:8888"  # Prometheus metrics
      - "8889:8889"  # Prometheus metrics (exporter)
      - "13133:13133" # Health check
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol-config.yaml:ro
    networks:
      - mqtt-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.48
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - mqtt-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mqtt-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: jaeger
    ports:
      - "16686:16686"  # UI
      - "14250:14250"  # gRPC
      - "14268:14268"  # HTTP
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
    volumes:
      - jaeger-data:/var/lib/jaeger
    networks:
      - mqtt-observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt-test-publisher:
    build:
      context: ./test-publisher
      dockerfile: Dockerfile
    container_name: mqtt-test-publisher
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - PUBLISH_INTERVAL=5
      - TOPIC_PREFIX=devices
      - DEVICE_COUNT=5
      - TRACE_ENABLED=true
    depends_on:
      mosquitto:
        condition: service_healthy
      mqtt-interceptor:
        condition: service_healthy
    networks:
      - mqtt-observability
    restart: unless-stopped
    profiles:
      - testing

networks:
  mqtt-observability:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-logs:
  prometheus-data:
  grafana-data:
  jaeger-data: