repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/pylint-dev/pylint
  rev: v4.0.6
  hooks:
  - id: pylint
    # Byte-identical reviewed upstream code: linting must not rewrite its provenance.
    # Security scanners still inspect every helper; the local hash test below is mandatory.
    exclude: ^recovery/(archive|restore|prepare)\.py$
    args:
    - --load-plugins=pylint_pydantic
    - --init-hook=import sys; sys.path[:0] = ["mqtt-interceptor/src", "mosquitto-exporter/src", "scripts"]
    additional_dependencies:
    - pylint-pydantic==0.4.0
    - pytest==9.1.1
    - pytest-asyncio==1.4.0
    - PyYAML==6.0.3
    - paho-mqtt==2.1.0
    - pydantic==2.13.4
    - pydantic-settings==2.14.2
    - opentelemetry-api==1.44.0
    - opentelemetry-sdk==1.44.0
    - opentelemetry-exporter-otlp==1.44.0
    - opentelemetry-exporter-prometheus==0.65b0
    - structlog==26.1.0
    - prometheus-client==0.26.0

- repo: local
  hooks:
  - id: recovery-boundaries
    name: recovery boundaries and immutable helper provenance
    entry: python3 -m unittest discover -s tests/recovery -p test_*.py
    language: system
    pass_filenames: false
    always_run: true
