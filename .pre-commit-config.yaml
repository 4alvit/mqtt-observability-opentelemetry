repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: local
  hooks:
  - id: component-lint
    name: Locked component lint and type checks
    entry: bash scripts/ci.sh lint
    language: system
    pass_filenames: false
    files: ^(mqtt-interceptor|mosquitto-exporter)/
